services:
  mailthing:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_HOST: 0.0.0.0
      SMTP_HOST: 0.0.0.0
      DATABASE_URL: sqlite:///app/data/mailthing.db
    ports:
      - "127.0.0.1:9005:9005"
      - "2500:2500"
    volumes:
      - mailthing-data:/app/data
volumes:
  mailthing-data:

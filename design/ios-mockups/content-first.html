<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailthing · Content first</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="content-first.css" />
  </head>
  <body>
    <main>
      <header class="board-header">
        <div>
          <p class="eyebrow">MAILTHING / A DIFFERENT STRUCTURE</p>
          <h1>Open the app. See your mail.</h1>
        </div>
      </header>
      <section class="concepts">
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Inbox</h2>
              <p>No top toolbar. No heading. No search field.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="inbox"></div>
        </article>
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Reading</h2>
              <p>Subject, sender, then straight into the message.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="reader"></div>
        </article>
      </section>
      <footer>
        Concept mockup · Fictional mail<span>Navigation stays within thumb reach.</span>
      </footer>
    </main>
    <script src="mockups.js"></script>
    <script src="content-first.js"></script>
  </body>
</html>

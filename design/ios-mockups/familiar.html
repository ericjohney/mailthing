<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailthing · Familiar mail</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="familiar.css" />
  </head>
  <body>
    <main>
      <header class="board-header">
        <div>
          <p class="eyebrow">MAILTHING / APPLE MAIL DIRECTION</p>
          <h1>Familiar mail. A little quieter.</h1>
        </div>
      </header>
      <section class="concepts">
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Inbox</h2>
              <p>Standard navigation. Clear, familiar message rows.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="inbox"></div>
        </article>
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Reading</h2>
              <p>Back at the top. Message actions at the bottom.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="reader"></div>
        </article>
      </section>
      <footer>
        Concept mockup · Fictional mail<span>Native conventions, compact spacing.</span>
      </footer>
    </main>
    <script src="mockups.js"></script>
    <script src="familiar.js"></script>
  </body>
</html>

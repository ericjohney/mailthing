<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailthing · Compact top navigation</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mailthing.css" />
  </head>
  <body>
    <main>
      <header class="board-header">
        <div>
          <p class="eyebrow">MAILTHING / COMPACT TOP NAVIGATION</p>
          <h1>Your mail, right up front.</h1>
        </div>
      </header>
      <section class="concepts">
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Inbox</h2>
              <p>Mailbox, search, and compose in one compact row.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="inbox"></div>
        </article>
        <article class="concept native">
          <div class="concept-heading">
            <div>
              <h2>Reading</h2>
              <p>Sender and actions above the message.</p>
            </div>
          </div>
          <div class="phone" data-direction="native" data-screen="reader"></div>
        </article>
      </section>
      <footer>
        Concept mockup · Fictional mail<span>Charcoal identity. All navigation at the top.</span>
      </footer>
    </main>
    <script src="mockups.js"></script>
    <script src="mailthing.js"></script>
  </body>
</html>

const seeds=[{id:'work',name:'Work',color:'#777d88',total:42,unread:4,pinned:true,guidance:'Project updates, meeting notes, and conversations with my team.',examples:8},{id:'travel',name:'Travel',color:'#879988',total:18,unread:2,pinned:true,guidance:'Flight confirmations, hotel bookings, and plans for upcoming trips.',examples:5},{id:'receipts',name:'Receipts',color:'#ba9a74',total:56,unread:3,pinned:true,guidance:'Purchase receipts, invoices, and payment confirmations.',examples:12},{id:'reading',name:'Reading',color:'#9a8da5',total:24,unread:0,pinned:false,guidance:'Newsletters and long reads I want to come back to.',examples:3},{id:'people',name:'People',color:'#9c9290',total:12,unread:0,pinned:false,guidance:'',examples:0},{id:'home',name:'Home',color:'#829ca5',total:9,unread:0,pinned:false,guidance:'',examples:0}];
const concepts=[{id:'drawer',short:'Drawer first',title:'Labels, within reach',description:'Move labels above the less-used mailboxes. Give the section a visible Manage action and a permanent New label row.',captions:['A · The everyday entry point','B · A proper place to manage'],notes:['<strong>Find it immediately.</strong> Inbox, Unread and Starred stay first. Labels follow, while the remaining folders tuck into More mailboxes.','<strong>Manage in one place.</strong> Search, create and edit labels on iPhone. Put sorting guidance alongside the label it belongs to.'],views:['drawer','manage'],foot:'Start with 01 and borrow the message picker from 03. This makes management discoverable without adding a permanent bar to the inbox.'},{id:'library',short:'Label library',title:'A home for your labels',description:'Give labels an explicit entry in the inbox. A visual library makes every label feel like a useful collection of mail.',captions:['A · Visible in the inbox','B · Browse the label library'],notes:['<strong>Prominent every day.</strong> A labeled button and pinned shortcuts sit directly below the mailbox heading. Tap a shortcut to filter mail.','<strong>Browse before you manage.</strong> Open a collection, edit its details, or create a new one. More visible, but the shortcut row takes space from messages.'],views:['inbox','library'],foot:'Best if labels are a primary way to browse mail. Pin only the labels you use often; keep the full collection in the library.'},{id:'context',short:'In context',title:'Organize as you read',description:'Make creating and applying labels one continuous task. Keep a direct path to label details inside the picker.',captions:['A · Apply or create a label','B · Edit the label itself'],notes:['<strong>No detour to Settings.</strong> Search, select several labels, or create one without leaving the conversation. Changes apply together.','<strong>Everything about one label.</strong> Rename, choose a color, pin it, and explain what belongs in it. A clear delete action preserves the mail.'],views:['picker','editor'],foot:'Pair with 01 for discovery. A contextual picker makes the frequent action faster, but still needs an obvious home for the full label list.'}];
let labels=structuredClone(seeds),conceptIndex=0,theme='light',mobileScreen=0,firstLabel=false,sequence=0,deleted=null;
let states=[];
const tap=(action,symbol,label,extra='')=>`<button type="button" class="tap ${extra}" data-action="${action}" aria-label="${esc(label)}" title="${esc(label)}">${icon(symbol)}</button>`;
const dot=label=>`<span class="dot" style="background:${esc(label.color)}" aria-hidden="true"></span>`;
const getLabel=id=>labels.find(l=>l.id===id);
function sortedLabels(s){let out=labels.filter(l=>l.name.toLowerCase().includes((s.query||'').toLowerCase()));return out.sort((a,b)=>s.sort==='name'?a.name.localeCompare(b.name):Number(b.pinned)-Number(a.pinned)||a.name.localeCompare(b.name));}
function nav(title,left,right){return `<div class="nav"><div class="nav-side">${left||''}</div><span class="nav-title">${title}</span><div class="nav-side end">${right||''}</div></div>`;}
function primary(text,action,symbol='plus'){return `<button type="button" class="primary" data-action="${action}">${icon(symbol)}${text}</button>`;}
function search(s,prompt='Search labels'){return `<label class="search">${icon('search')}<input type="search" data-search="labels" value="${esc(s.query||'')}" placeholder="${prompt}" aria-label="${prompt}"></label>`;}
function empty(){return `<div class="empty">${icon('tag')}<strong>A little order, your way.</strong><p>Create labels for projects, receipts, or anything you want to find later.</p>${primary('Create your first label','create')}</div>`;}
function drawer(s){return `${nav('Mailboxes',tap('inbox','close','Close mailboxes'),tap('settings','settings','Preview settings'))}<div class="scroll"><div class="account"><div class="logo">${icon('mark')}</div><div><strong>Alex Morgan</strong><span>alex@example.com</span></div></div>${[['inbox','Inbox','9'],['unread','Unread','9'],['star','Starred','']].map(([i,t,n])=>`<button type="button" class="row ${i==='inbox'?'active':''}" data-folder="${t}">${icon(i)}<span class="grow">${t}</span><span class="count">${n}</span></button>`).join('')}<div class="section-line"><h2>Labels</h2><button type="button" class="text-button" data-action="manage">Manage</button></div>${labels.length?labels.filter(l=>l.pinned).map(l=>`<button type="button" class="row" data-folder="${esc(l.name)}">${dot(l)}<span class="grow truncate">${esc(l.name)}</span><span class="count">${l.unread||''}</span></button>`).join(''):'<p class="empty-small">Your projects, plans, and favorite things.<br>Create a label to get started.</p>'}<button type="button" class="row new-row" data-action="create">${icon('plus')}<span>New label</span></button>${labels.filter(l=>!l.pinned).length?`<button type="button" class="row" data-action="manage">${icon('tag')}<span class="grow">All labels</span><span class="count">${labels.length}</span>${icon('right')}</button>`:''}<div class="divider"></div><button type="button" class="row" data-action="more-folders">${icon(s.more?'down':'right')}<span>More mailboxes</span></button>${s.more?['Snoozed','Important','Sent','Drafts','All mail','Spam','Trash'].map(t=>`<button type="button" class="row" data-folder="${t}">${icon(t==='Sent'?'sent':t==='Trash'?'trash':'inbox')}<span>${t}</span></button>`).join(''):''}</div>`;}
function managerRows(s){const list=sortedLabels(s);return list.length?list.map(l=>`<div class="label-entry"><button type="button" class="label-open" data-folder="${esc(l.name)}">${dot(l)}<span class="label-info"><strong class="truncate">${esc(l.name)}</strong><span>${l.total} conversations${l.unread?` · ${l.unread} unread`:''}</span></span></button><button type="button" class="tap" data-edit="${l.id}" aria-label="Edit ${esc(l.name)}">${icon('edit')}</button></div>`).join(''):'<p class="results-empty">No matching labels.</p>';}
function manage(s){return `${nav('Labels',tap('back','back','Back to mailboxes'),tap('create','plus','Create label'))}<h2 class="big-title">Your labels</h2><p class="subtitle">Keep mail organized, your way.</p>${labels.length?`${search(s)}<div class="scroll"><div class="list-heading"><span>Label</span><span>Edit</span></div><div data-results>${managerRows(s)}</div></div><div class="bottom-action">${primary('New label','create')}<p class="bottom-note">${labels.length} labels · Edit a label for sorting guidance</p></div>`:`<div class="scroll">${empty()}</div>`}`;}
const sampleMail=[{id:'m1',sender:'Nora Chen',initials:'NC',subject:'A few plans for Lisbon',snippet:'Found a lovely little place near the water. What do you think?',time:'10:42',label:'travel',unread:true},{id:'m2',sender:'Bookshop',initials:'B',subject:'Your receipt is ready',snippet:'Thanks for supporting independent bookstores.',time:'10:18',label:'receipts',unread:true},{id:'m3',sender:'Julian Park',initials:'JP',subject:'Notes from the studio',snippet:'A couple of ideas for the next version. I’d love your thoughts.',time:'9:56',label:'work',unread:true},{id:'m4',sender:'Field Notes',initials:'FN',subject:'A slower Sunday',snippet:'A good read and a recipe worth keeping for later.',time:'9:18',label:'reading',unread:false},{id:'m5',sender:'Leah Brooks',initials:'LB',subject:'A small thank you',snippet:'Lunch is on me next time. See you soon!',time:'Yesterday',label:'people',unread:false}];
function mailRows(folder){let mail=sampleMail.filter(m=>folder==='Inbox'||folder==='Unread'&&m.unread||getLabel(m.label)?.name===folder);return mail.length?mail.map(m=>`<button type="button" class="mail ${m.unread?'unread':''}" data-action="reader"><span class="avatar">${m.initials}</span><span class="mail-body"><span class="sender"><strong>${m.sender}</strong><time>${m.time}</time></span><span class="subject">${m.subject}</span><span class="snippet" style="display:block">${m.snippet}</span>${getLabel(m.label)?`<span class="tag">${icon('tag')}${esc(getLabel(m.label).name)}</span>`:''}</span></button>`).join(''):'<div class="empty"><strong>No mail here yet.</strong><p>Apply this label to a conversation to find it here.</p></div>';}
function inbox(s){const folder=s.folder||'Inbox';return `<div class="nav inbox-nav"><button type="button" class="tap" data-action="drawer" aria-label="Open mailboxes"><span class="logo">${icon('mark')}</span></button><span class="inbox-heading truncate">${esc(folder)}</span>${tap('search-mail','search','Search sample mail')}${tap('compose','compose','Compose preview')}</div>${conceptIndex===1?`<div class="chip-rail"><button type="button" class="filter-chip selected" data-action="library">${icon('tag')}Labels <span style="opacity:.6">${labels.length}</span></button>${labels.filter(l=>l.pinned).map(l=>`<button type="button" class="filter-chip" data-folder="${esc(l.name)}">${dot(l)}${esc(l.name)}</button>`).join('')}</div>`:''}<div class="scroll">${mailRows(folder)}</div>`;}
function libraryCards(s){return sortedLabels(s).map(l=>`<button type="button" class="label-card" data-folder="${esc(l.name)}"><span class="card-top">${dot(l)}${l.pinned?icon('pin'):''}</span><strong class="truncate">${esc(l.name)}</strong><small>${l.total} conversations${l.unread?` · ${l.unread} new`:''}</small></button>`).join('')||'<p class="results-empty">No matching labels.</p>';}
function library(s){return `${nav('Labels',tap('back','back','Back to inbox'),tap('manage','edit','Manage all labels'))}<h2 class="big-title">A place for everything.</h2><p class="subtitle">Your mail, collected by what matters.</p>${labels.length?`${search(s)}<div class="scroll"><div class="library-head"><span>${labels.length} labels</span><button type="button" class="text-button" data-action="sort">${s.sort==='name'?'A to Z':'Pinned first'} ${icon('down')}</button></div><div class="grid-labels" data-results>${libraryCards(s)}</div></div><div class="bottom-action">${primary('New label','create')}</div>`:`<div class="scroll">${empty()}</div>`}`;}
function reader(s){const applied=labels.filter(l=>(s.selected||[]).includes(l.id));return `${nav('Inbox',`<button type="button" class="text-button" data-action="inbox">${icon('back')}Inbox</button>`,tap('more-reader','more','More conversation actions'))}<div class="scroll"><h2 class="reader-title">Notes from the studio</h2><button type="button" class="label-add" data-action="picker">${applied.length?applied.map(l=>`<span class="mini-chip">${icon('tag')}${esc(l.name)}</span>`).join(''):icon('tag')}<span>${applied.length?'Edit labels':'Add labels'}</span>${icon('plus')}</button><div class="reader-sender"><span class="avatar">JP</span><span><strong>Julian Park</strong><small>julian@example.com · to Alex</small></span></div><div class="reader-copy"><p>Hey Alex,</p><p>A couple of ideas for the next version. I’ve been thinking about how we can make the everyday things feel a little easier.</p><p>Let’s compare notes at the studio on Thursday?</p><p>Julian</p></div></div><div class="reader-controls">${tap('archive','archive','Archive preview')}${tap('picker','tag','Edit labels')}${tap('reply','reply','Reply preview')}</div>`;}
function palette(selected){return `<div class="swatches" role="group" aria-label="Label color">${[['Graphite','#777d88'],['Sage','#879988'],['Sand','#ba9a74'],['Lilac','#9a8da5'],['Rose','#af858d'],['Slate','#829ca5']].map(([name,color])=>`<button type="button" class="swatch" data-color="${color}" aria-label="${name}" aria-pressed="${color===selected}" style="--swatch:${color}"><span></span></button>`).join('')}</div>`;}
function editor(s){let l=getLabel(s.editId)||labels[0];if(!l)return manage(s);s.editId=l.id;return `${nav('Edit label',tap('back','back','Back to labels'),`<button type="submit" form="edit-${s.id}" class="text-button">Save</button>`)}<div class="scroll"><form id="edit-${s.id}" data-form="edit"><div class="editor-symbol" style="--label-color:${l.color}">${icon('tag')}</div><div class="field"><label class="field-label" for="name-${s.id}">Name</label><input id="name-${s.id}" type="text" name="name" value="${esc(l.name)}" required maxlength="50" autocomplete="off"></div><div class="field"><span class="field-label">Color</span><input type="hidden" name="color" value="${l.color}">${palette(l.color)}</div><label class="toggle-row"><span>Pin to mailboxes</span><input type="checkbox" name="pinned" ${l.pinned?'checked':''}></label><div class="divider" style="margin:12px 0 21px"></div><div class="field"><label class="field-label" for="guidance-${s.id}">Sorting guidance</label><textarea id="guidance-${s.id}" name="guidance" placeholder="What kind of mail belongs here?">${esc(l.guidance)}</textarea><small>Help Mailthing recognize mail for this label. Applying or removing labels teaches it too.</small></div><p class="inline-help">${l.examples} remembered examples · Your filters take precedence.</p><button type="button" class="danger" data-action="delete">${icon('trash')}Delete label</button><p class="form-error" role="alert" hidden></p></form></div>`;}
function page(s){return ({drawer,manage,inbox,library,reader,editor}[s.view]||manage)(s);}
function pickerRows(s){let list=sortedLabels({...s,query:s.pickerQuery||'',sort:'name'});return list.map(l=>`<button type="button" class="row picker-row" data-select="${l.id}" aria-pressed="${s.draftSelected.includes(l.id)}">${dot(l)}<span class="grow truncate">${esc(l.name)}</span><span class="check ${s.draftSelected.includes(l.id)?'on':''}">${s.draftSelected.includes(l.id)?icon('check'):''}</span></button>`).join('')||'<p class="results-empty">No matching labels. Create one below.</p>';}
function modalContent(s){if(s.modal==='picker')return `<div class="handle"></div>${nav('<span class="sheet-title">Labels</span>',`<button type="button" class="text-button muted" data-action="cancel-modal">Cancel</button>`,`<button type="button" class="text-button" data-action="apply">Apply</button>`)}<p class="sheet-context">For “Notes from the studio”</p><label class="search">${icon('search')}<input type="search" data-search="picker" aria-label="Find a label" placeholder="Find a label" value="${esc(s.pickerQuery||'')}"></label><div class="scroll" data-picker-results>${pickerRows(s)}</div><button type="button" class="row new-row" data-action="create">${icon('plus')}<span data-create-copy>${s.pickerQuery?`Create “${esc(s.pickerQuery)}”`:'Create new label'}</span></button><div class="picker-footer"><span class="count" data-selection-count>${s.draftSelected.length} selected</span><button type="button" class="text-button" data-action="manage">Manage labels ${icon('right')}</button></div>`;
if(s.modal==='create')return `<div class="handle"></div>${nav('<span class="sheet-title">New label</span>',`<button type="button" class="text-button muted" data-action="cancel-create">Cancel</button>`,'')}<p class="sheet-context">${s.fromPicker?'Create it and select it for this conversation.':'A simple way to bring related mail together.'}</p><form data-form="create"><div class="field"><label class="field-label" for="new-name-${s.id}">Name</label><input id="new-name-${s.id}" type="text" name="name" placeholder="e.g. Weekend plans" value="${esc(s.pickerQuery||'')}" required maxlength="50" autocomplete="off"></div><div class="field"><span class="field-label">Color</span><input type="hidden" name="color" value="#777d88">${palette('#777d88')}</div><label class="toggle-row"><span>Pin to mailboxes</span><input type="checkbox" name="pinned" checked></label><p class="form-error" role="alert" hidden></p><button type="submit" class="primary">${icon('plus')}${s.fromPicker?'Create & select label':'Create label'}</button></form>`;
if(s.modal==='delete'){const l=getLabel(s.editId);return `<div class="handle"></div><h3 class="sheet-title">Delete “${esc(l?.name||'')}”?</h3><p class="confirm-copy">This removes the label from your mailbox and conversations. Your messages stay exactly where they are.</p><div class="confirm-actions"><button type="button" data-action="cancel-modal">Keep label</button><button type="button" class="delete-confirm" data-action="confirm-delete">Delete label</button></div>`;}
return `<div class="handle"></div>${nav('Prototype',null,tap('cancel-modal','close','Close preview note'))}<p class="confirm-copy">${esc(s.notice||'This study focuses on label management. Try creating, editing, pinning, or applying a label.')}</p>`;}
function phoneMarkup(s){return `<div class="status"><span>9:41</span><span class="island" aria-hidden="true"></span><span class="status-icons" aria-hidden="true">${icon('signal')}${icon('wifi')}<span class="battery"></span></span></div><div class="stage"><div class="page" ${s.modal?'inert':''}>${page(s)}</div>${s.modal?`<div class="overlay"><section class="sheet" role="dialog" aria-label="${s.modal==='picker'?'Apply labels':s.modal==='create'?'Create label':s.modal==='delete'?'Delete label':'Prototype notice'}">${modalContent(s)}</section></div>`:''}${s.toast?`<div class="toast" role="status"><span>${esc(s.toast)}</span>${s.undo?'<button type="button" data-action="undo">Undo</button>':'<button type="button" data-action="dismiss-toast" aria-label="Dismiss notification">OK</button>'}</div>`:''}</div><div class="home" aria-hidden="true"></div>`;}
function renderPhone(s){
  const el=document.querySelector(`[data-phone="${s.id}"]`);if(!el)return;
  const active=el.contains(document.activeElement)?document.activeElement:null;
  const selector=active?.id?'#'+CSS.escape(active.id):active?.dataset.action?'[data-action="'+CSS.escape(active.dataset.action)+'"]':active?.getAttribute('aria-label')?'[aria-label="'+CSS.escape(active.getAttribute('aria-label'))+'"]':null;
  el.innerHTML=phoneMarkup(s);
  if(active){let target=selector?el.querySelector(selector):null;if(!target||target.closest('[inert]'))target=el.querySelector('.sheet button, .sheet input, .page button, .page input');target?.focus({preventScroll:true});}
}
function renderAllPhones(){states.forEach(renderPhone);}
function resetStates(){states=concepts[conceptIndex].views.map((v,id)=>({id,view:v==='picker'?'reader':v,modal:v==='picker'?'picker':null,selected:['work'].filter(getLabel),draftSelected:['work'].filter(getLabel),editId:'work',query:'',pickerQuery:'',history:[],folder:'Inbox',sort:'pinned'}));}
function renderGallery(){const c=concepts[conceptIndex];document.querySelector('.concept-tabs').innerHTML=concepts.map((item,i)=>`<button type="button" role="tab" id="tab-${item.id}" aria-controls="concept-panel" aria-selected="${i===conceptIndex}" tabindex="${i===conceptIndex?0:-1}" class="concept-tab" data-concept="${i}"><small>0${i+1}</small><strong>${item.short}</strong></button>`).join('');document.getElementById('concept-panel').setAttribute('aria-labelledby','tab-'+c.id);document.getElementById('concept-title').textContent=c.title;document.getElementById('description').textContent=c.description;document.getElementById('recommend').hidden=conceptIndex!==0;document.getElementById('screens').innerHTML=states.map((s,i)=>`<section class="screen-column ${i===mobileScreen?'mobile-active':''}" data-column="${i}" aria-label="${c.captions[i]}"><p class="screen-caption"><span class="caption-number">${i===0?'A':'B'}</span>${c.captions[i].slice(4)}</p><div class="phone" data-phone="${s.id}" data-theme="${theme}">${phoneMarkup(s)}</div></section>`).join('');document.getElementById('notes').innerHTML=c.notes.map((n,i)=>`<p class="${i===mobileScreen?'mobile-active':''}">${n}</p>`).join('');document.getElementById('footnote').innerHTML=icon('info')+`<span>${c.foot} <span style="opacity:.75">Interactive sample data; changes stay in this preview.</span></span>`;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.screen)===mobileScreen)));document.getElementById('empty-toggle').textContent=firstLabel?'Sample labels':'First label';}
function go(s,view){s.history.push({view:s.view,modal:s.modal,editId:s.editId,folder:s.folder});s.view=view;s.modal=null;s.query='';s.toast=null;renderPhone(s);}
function back(s){const prior=s.history.pop();if(prior)Object.assign(s,prior);else{s.view=s.view==='editor'?'manage':conceptIndex===0?'drawer':conceptIndex===1?'inbox':'reader';s.modal=null;}s.query='';renderPhone(s);}
function toast(s,message,undo=false){s.toast=message;s.undo=undo;renderPhone(s);}
function showPicker(s){s.modal='picker';s.draftSelected=[...s.selected.filter(getLabel)];s.pickerQuery='';renderPhone(s);}
function updatePicker(s,phone){phone.querySelector('[data-picker-results]').innerHTML=pickerRows(s);phone.querySelector('[data-selection-count]').textContent=s.draftSelected.length+' selected';phone.querySelector('[data-create-copy]').textContent=s.pickerQuery?`Create “${s.pickerQuery}”`:'Create new label';}
document.addEventListener('click',event=>{
const themeButton=event.target.closest('.theme-toggle button');if(themeButton){theme=themeButton.dataset.theme;document.querySelectorAll('.phone').forEach(el=>el.dataset.theme=theme);document.querySelectorAll('.theme-toggle button').forEach(b=>b.setAttribute('aria-pressed',String(b===themeButton)));return;}
const conceptButton=event.target.closest('[data-concept]');if(conceptButton){conceptIndex=Number(conceptButton.dataset.concept);resetStates();renderGallery();document.querySelector('[aria-selected=true]').focus({preventScroll:true});return;}
const screenButton=event.target.closest('[data-screen]');if(screenButton){mobileScreen=Number(screenButton.dataset.screen);renderGallery();return;}
if(event.target.closest('#reset')){labels=structuredClone(seeds);firstLabel=false;deleted=null;resetStates();renderGallery();return;}
if(event.target.closest('#empty-toggle')){firstLabel=!firstLabel;labels=firstLabel?[]:structuredClone(seeds);resetStates();if(firstLabel)states[1].view='manage';renderGallery();return;}
const phone=event.target.closest('[data-phone]');if(!phone)return;const s=states[Number(phone.dataset.phone)],action=event.target.closest('[data-action]')?.dataset.action;
const edit=event.target.closest('[data-edit]');if(edit){go(s,'editor');s.editId=edit.dataset.edit;renderPhone(s);return;}
const folder=event.target.closest('[data-folder]');if(folder){s.folder=folder.dataset.folder;go(s,'inbox');return;}
const select=event.target.closest('[data-select]');if(select){const id=select.dataset.select;s.draftSelected=s.draftSelected.includes(id)?s.draftSelected.filter(x=>x!==id):[...s.draftSelected,id];updatePicker(s,phone);return;}
const color=event.target.closest('[data-color]');if(color){const form=color.closest('form');form.querySelector('[name=color]').value=color.dataset.color;form.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b===color)));const symbol=form.querySelector('.editor-symbol');if(symbol)symbol.style.setProperty('--label-color',color.dataset.color);return;}
if(action==='back')back(s);
else if(['manage','drawer','library','inbox'].includes(action))go(s,action);
else if(action==='reader'){go(s,'reader');s.selected=['work'].filter(getLabel);renderPhone(s);}
else if(action==='more-folders'){s.more=!s.more;renderPhone(s);}
else if(action==='sort'){s.sort=s.sort==='name'?'pinned':'name';renderPhone(s);}
else if(action==='picker')showPicker(s);
else if(action==='create'){s.fromPicker=s.modal==='picker';s.modal='create';renderPhone(s);phone.querySelector('input[name=name]')?.focus({preventScroll:true});}
else if(action==='cancel-create'){s.modal=s.fromPicker?'picker':null;renderPhone(s);}
else if(action==='cancel-modal'){s.modal=null;renderPhone(s);}
else if(action==='apply'){s.selected=[...s.draftSelected];s.modal=null;toast(s,`${s.selected.length} label${s.selected.length===1?'':'s'} applied`);}
else if(action==='delete'){s.modal='delete';renderPhone(s);}
else if(action==='confirm-delete'){deleted={...getLabel(s.editId)};labels=labels.filter(l=>l.id!==s.editId);states.forEach(st=>{st.selected=st.selected.filter(getLabel);st.draftSelected=st.draftSelected.filter(getLabel);});s.modal=null;s.view='manage';s.query='';s.toast='Label deleted. Your mail is safe.';s.undo=true;renderAllPhones();}
else if(action==='undo'&&deleted){labels.push(deleted);deleted=null;s.toast='Label restored';s.undo=false;renderAllPhones();}
else if(action==='dismiss-toast'){s.toast=null;renderPhone(s);}
else if(action){s.notice=action==='settings'?'Labels now have their own home in the drawer. General settings stay on the existing Settings page.':'This study focuses on labels. Create, edit, pin, delete, and apply labels using the controls shown.';s.modal='notice';renderPhone(s);}
});
document.addEventListener('input',event=>{const phone=event.target.closest('[data-phone]');if(!phone)return;const s=states[Number(phone.dataset.phone)];if(event.target.dataset.search==='labels'){s.query=event.target.value;const target=phone.querySelector('[data-results]');if(target)target.innerHTML=s.view==='library'?libraryCards(s):managerRows(s);}if(event.target.dataset.search==='picker'){s.pickerQuery=event.target.value;updatePicker(s,phone);}});
document.addEventListener('submit',event=>{const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();const phone=form.closest('[data-phone]'),s=states[Number(phone.dataset.phone)],data=new FormData(form),name=String(data.get('name')).trim(),error=form.querySelector('.form-error');if(!name||labels.some(l=>l.name.toLowerCase()===name.toLowerCase()&&(form.dataset.form==='create'||l.id!==s.editId))){error.hidden=false;error.textContent=name?'A label with this name already exists.':'Give your label a name.';return;}
if(form.dataset.form==='edit'){const label=getLabel(s.editId);Object.assign(label,{name,color:data.get('color'),pinned:data.has('pinned'),guidance:String(data.get('guidance')).trim()});s.modal=null;s.view='manage';s.query='';s.toast='Label updated';renderAllPhones();}
else{const label={id:'new-'+(++sequence),name,color:data.get('color'),pinned:data.has('pinned'),total:0,unread:0,guidance:'',examples:0};labels.push(label);if(s.fromPicker){s.draftSelected.push(label.id);s.pickerQuery='';s.modal='picker';s.toast='Label created and selected';}else{s.modal=null;s.toast='Label created';}renderAllPhones();}
});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[data-concept]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();conceptIndex=event.key==='Home'?0:event.key==='End'?2:(conceptIndex+(event.key==='ArrowRight'?1:2))%3;resetStates();renderGallery();document.querySelector('[aria-selected=true]').focus();}if(event.key==='Escape'){const phone=event.target.closest('[data-phone]');if(phone){const s=states[Number(phone.dataset.phone)];s.modal=s.modal==='create'&&s.fromPicker?'picker':null;renderPhone(s);}}});
document.querySelector('[data-theme=light]').innerHTML=icon('sun');document.querySelector('[data-theme=dark]').innerHTML=icon('moon');
resetStates();renderGallery();
window.labelStudy={getState:()=>({concept:concepts[conceptIndex].id,labels:structuredClone(labels),screens:structuredClone(states),theme}),showConcept:id=>{const index=concepts.findIndex(c=>c.id===id);if(index<0)return;conceptIndex=index;resetStates();renderGallery();},setTheme:value=>{theme=value;document.querySelectorAll('.phone').forEach(el=>el.dataset.theme=theme);document.querySelectorAll('.theme-toggle button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));}};
</script>
</body>
</html>

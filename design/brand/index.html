<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mailthing · Folded m</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeefec; color: #292c2d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 44px 48px; }
    .eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6e7476; }
    .intro { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 30px; }
    .intro p { font-size: 13px; color: #636b70; }
    .hero { display: flex; align-items: center; justify-content: center; gap: 25px; background: #fff; border: 1px solid #e5e7e6; min-height: 280px; border-radius: 18px; }
    .hero img { width: 106px; height: 106px; }
    .wordmark { font-size: 76px; font-weight: 600; letter-spacing: -4px; line-height: 1; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px; }
    .card { height: 214px; border-radius: 14px; padding: 22px; background: #fff; border: 1px solid #e5e7e6; }
    .caption { margin: 0; color: #6e7476; font-size: 11px; }
    .app-icon { display: block; width: 114px; height: 114px; margin: 22px auto 0; border-radius: 26px; }
    .dark { background: #171a1b; color: #e5e8e7; border-color: #343b3d; }
    .dark .caption { color: #a4adb0; }
    .lockup { display: flex; gap: 9px; align-items: center; justify-content: center; margin-top: 55px; }
    .lockup img { width: 32px; height: 32px; border-radius: 9px; box-shadow: 0 0 0 1px #343b3d; }
    .copy { font-size: 23px; font-weight: 600; letter-spacing: -1px; }
    .copy small { display: block; font-size: 8px; font-weight: 400; letter-spacing: 2px; margin-top: 6px; color: #a4adb0; }
    .sizes { display: flex; align-items: center; justify-content: center; gap: 22px; height: 143px; }
    .sizes figure { margin: 0; text-align: center; }
    .sizes figcaption { margin-top: 14px; font-size: 10px; color: #6e7476; }
    footer { display: flex; justify-content: space-between; margin-top: 24px; font-size: 12px; color: #636b70; }
    @media (max-width: 700px) { main { padding: 24px; } .intro { display: block; } .hero { min-height: 210px; gap: 16px; } .hero img { width: 60px; height: 60px; } .wordmark { font-size: 42px; letter-spacing: -2px; } .grid { grid-template-columns: 1fr; } footer { gap: 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="intro"><span class="eyebrow">Mailthing / Brand identity</span><p>A folded m. A little envelope. Your personal mail.</p></div>
    <div class="hero"><img src="../../web/public/brand/mailthing-mark.svg" alt="Mailthing folded m mark" /><span class="wordmark">mailthing</span></div>
    <div class="grid">
      <div class="card"><p class="caption">01 / App icon</p><img class="app-icon" src="../../ios/Mailthing/Assets.xcassets/AppIcon.appiconset/AppIcon.png" alt="Mailthing app icon" /></div>
      <div class="card dark"><p class="caption">02 / Dark header</p><div class="lockup"><img src="../../web/public/brand/mailthing-mark.svg" alt="" /><span class="copy">mailthing<small>PERSONAL MAIL</small></span></div></div>
      <div class="card"><p class="caption">03 / Small sizes</p><div class="sizes"><figure><img src="../../web/public/brand/mailthing-mark.svg" width="16" height="16" alt="" /><figcaption>16 px</figcaption></figure><figure><img src="../../web/public/brand/mailthing-mark.svg" width="24" height="24" alt="" /><figcaption>24 px</figcaption></figure><figure><img src="../../web/public/brand/mailthing-mark.svg" width="32" height="32" alt="" /><figcaption>32 px</figcaption></figure></div></div>
    </div>
    <footer><span>Charcoal + white. Rounded edges. Lowercase type.</span><span>One mark across web and iOS.</span></footer>
  </main>
</body>
</html>

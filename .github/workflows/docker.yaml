name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ericjohney-org-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            registry.ericj5.com/mailthing:latest
            registry.ericj5.com/mailthing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Docker build summary
        run: |
          echo "Docker image built and pushed successfully"
          echo "- registry.ericj5.com/mailthing:latest"
          echo "- registry.ericj5.com/mailthing:${{ github.sha }}"

  update-argocd:
    runs-on: ericjohney-org-runners
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout ArgoCD repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argocd
          path: argocd
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}

      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag
        run: |
          cd argocd/apps/mailthing
          yq -i '.image.tag = "${{ github.sha }}"' values.yaml

      - name: Commit and push changes
        run: |
          cd argocd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mailthing/values.yaml
          git commit -m "Update mailthing image tag to ${{ github.sha }}" || exit 0
          git push

name: iOS TestFlight Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        type: string
        default: '1.0.2'
        required: true
permissions:
  contents: read
concurrency:
  group: ios-testflight-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: brew install xcodegen
      - name: Prepare private signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          signing="$RUNNER_TEMP/mailthing-signing"
          mkdir -m 700 "$signing"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$signing/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" > "$signing/p12-password.txt"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$signing/Mailthing_AppStore.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY" > "$signing/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$signing"/*
          echo "SIGNING_DIRECTORY=$signing" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$signing/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Allocate build number
        run: |
          BUILD_NUMBER_FLOOR=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          export BUILD_NUMBER_FLOOR
          number=$(node ios/scripts/apple.mjs allocate)
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
      - name: Archive, validate, and upload
        run: ios/scripts/release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mailthing-${{ inputs.version }}-${{ env.BUILD_NUMBER }}
          path: |
            ios/export/*.ipa
            ios/build/Mailthing.xcarchive/dSYMs
          retention-days: 30
      - name: Remove signing assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/mailthing-signing"

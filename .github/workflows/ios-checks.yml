name: iOS Checks
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-checks.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-checks.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: node --test ios/scripts/version.test.mjs
      - run: brew install xcodegen
      - name: Generate and test native app
        run: |
          cd ios
          xcodegen generate
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcodebuild -project Mailthing.xcodeproj -scheme Mailthing -destination "platform=iOS Simulator,id=$device_id" -resultBundlePath "$RUNNER_TEMP/Mailthing-tests.xcresult" CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/Mailthing-tests.xcresult
